<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grammar test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--card:#fff;--line:#E4E0D6;--ink:#1E2321;--muted:#5F6662;--accent:#1F6F5B;--accent-soft:#E3F0EB;--accent-ink:#165244;--field:#fff;--ok:#1a7f4b}
@media (prefers-color-scheme:dark){:root{--bg:#161A18;--card:#1F2522;--line:#2E3631;--ink:#ECEFEC;--muted:#A3ACA6;--accent:#5FBFA3;--accent-soft:#21342E;--accent-ink:#9FE0CB;--field:#161A18;--ok:#7fd6a5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 72px}
.brand{font-size:14px;color:var(--muted)}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0}
h1{font-size:30px;line-height:1.15;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.part{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px 10px;margin:0 0 16px}
.part h2{font-size:19px;line-height:1.3;margin:2px 0 2px}
.pts{font-family:'DM Sans',system-ui,sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
.q{margin:14px 0}
.num{font-weight:700;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0 22px}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:10px}
.opts label:hover{background:var(--accent-soft)}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
input[type=text],textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.gap{width:min(240px,100%);margin:0 4px}
.hint{color:var(--muted)}
.row{display:flex;align-items:center;gap:6px}
.row .full{flex:1;min-width:0}
.full{width:100%}
textarea.full{margin-top:6px;min-height:48px;resize:vertical}
.sub{margin:10px 0 2px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
button{font:inherit;border-radius:12px;padding:12px 22px;cursor:pointer;border:1px solid var(--accent)}
.primary{background:var(--accent);color:#fff;font-weight:600;min-height:48px}
.primary:hover{filter:brightness(.92)}
.ghost{background:transparent;color:var(--accent);padding:8px 14px;font-size:14px;border-color:var(--line)}
.ghost:hover{background:var(--accent-soft)}
#sendHint{width:100%;margin:2px 0 0;font-size:14px;color:var(--muted)}
#sendDone{width:100%;border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:600;text-align:center}
#sendDone.warn{border-color:var(--line);color:var(--ink)}
#sendLink{width:100%;height:34px;font-size:12px;color:var(--muted);padding:0 10px}
.locked{opacity:.6}
.res{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 0;padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.res.ok{border-color:var(--ok)}.res.bad{border-color:#c0392b}
.res .t{flex:1;min-width:0}.res .m{font-weight:700}.res.ok .m{color:var(--ok)}.res.bad .m{color:#c0392b}
.res .none{color:var(--muted)}
.scoreline{font-size:19px;font-weight:600;margin:0 0 6px}
.msg{text-align:center;padding:60px 0}
.key{display:none}
@media print{
  @page{size:A4;margin:13mm 15mm}
  :root{--bg:#fff;--card:#fff;--line:#000;--ink:#000;--muted:#333;--field:#fff;--accent:#000;--accent-soft:#fff}
  body{background:#fff;color:#000;font-size:10.5pt;line-height:1.4}
  .wrap{max-width:none;padding:0}
  .brand,.actions,#sendHint,#sendDone,#sendLink{display:none!important}
  h1{font-size:18pt;margin:0 0 2px}
  .lead{margin:0 0 6px;font-size:10pt}
  .part{border:none;border-radius:0;padding:0;margin:8px 0 0;background:none}
  .part h2{font-size:11.5pt}
  .q{margin:5px 0;break-inside:avoid}
  .opts{margin:1px 0 0 16px;gap:0 16px}
  .opts label{padding:0}
  input[type=text],textarea{border:none;border-bottom:1px solid #000;border-radius:0;padding:1px 4px;background:none;color:#000}
  .gap{width:150px}
  textarea.full{min-height:0;resize:none;overflow:visible}
  .key{display:block;break-before:page;page-break-before:always}
  .key h2{font-size:12pt;margin:12px 0 2px}
  .key p,.key li{font-size:10.5pt;margin:3px 0}
  .key ul{padding-left:18px;margin:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg lead">Loading…</div></div>

<script>
(function () {
  var app = document.getElementById('app');
  var slug = (new URLSearchParams(location.search).get('set') || '').trim();
  var T = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fail(msg) {
    app.textContent = '';
    var d = el('div', 'msg');
    d.appendChild(el('h1', null, 'This link is not valid'));
    d.appendChild(el('p', 'lead', msg || 'Please ask your teacher for a new one.'));
    app.appendChild(d);
  }
  if (!/^[A-Za-z0-9-]+$/.test(slug)) { fail(); return; }

  fetch('/vocab-sets/' + slug + '.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (data) {
      if (!data || data.kind !== 'grammarTest' || !Array.isArray(data.parts)) throw 0;
      T = data;
      var code = new URLSearchParams(location.search).get('r');
      if (code) renderResults(code); else render();
    })
    .catch(function () { fail(); });

  var LET = ['a', 'b', 'c', 'd', 'e', 'f'];
  var counter;

  // helper: lay a sentence with a gap marker ___ out of text pieces
  function render() {
    document.title = (T.topic || 'Grammar') + ' test';
    app.textContent = '';
    counter = 1;
    app.appendChild(el('div', 'brand', 'Anna | WeTalk'));
    app.appendChild(el('h1', null, (T.topic || 'Grammar') + ': Test'));
    if (T.intro) app.appendChild(el('p', 'lead', T.intro));

    var form = el('form');
    form.autocomplete = 'off';
    form.addEventListener('submit', function (e) { e.preventDefault(); });

    T.parts.forEach(function (part, pi) {
      var sec = el('section', 'part');
      var h = el('h2', null, 'Part ' + (pi + 1) + '. ' + part.title + ' ');
      h.appendChild(el('span', 'pts', '(' + (part.pointsLabel || (part.max + ' points')) + ')'));
      sec.appendChild(h);
      part.startNum = counter;

      if (part.type === 'choice') {
        part.items.forEach(function (it) {
          var n = counter++;
          var q = el('div', 'q');
          q.appendChild(el('span', 'num', n + '.'));
          q.appendChild(document.createTextNode(it.q.replace('___', '______')));
          var opts = el('div', 'opts');
          it.options.forEach(function (o, j) {
            var lab = el('label');
            var r = el('input');
            r.type = 'radio'; r.name = 'q' + n; r.value = o;
            lab.appendChild(r);
            lab.appendChild(document.createTextNode(' ' + LET[j] + ') ' + o));
            opts.appendChild(lab);
          });
          q.appendChild(opts);
          sec.appendChild(q);
          it.n = n;
        });
      } else if (part.type === 'gap') {
        part.items.forEach(function (it) {
          var n = counter++;
          var q = el('div', 'q');
          q.appendChild(el('span', 'num', n + '.'));
          if (it.pre) q.appendChild(document.createTextNode(it.pre + ' '));
          var inp = el('input', 'gap');
          inp.type = 'text'; inp.name = 'q' + n;
          inp.setAttribute('aria-label', 'Answer ' + n);
          inp.autocapitalize = 'off'; inp.spellcheck = false;
          q.appendChild(inp);
          if (it.hint) q.appendChild(el('span', 'hint', ' (' + it.hint + ')'));
          if (it.post) q.appendChild(document.createTextNode(' ' + it.post));
          sec.appendChild(q);
          it.n = n;
        });
      } else if (part.type === 'fix') {
        part.items.forEach(function (it) {
          var n = counter++;
          var q = el('div', 'q row');
          q.appendChild(el('span', 'num', n + '.'));
          var inp = el('input', 'full');
          inp.type = 'text'; inp.name = 'q' + n; inp.value = it.sentence;
          inp.setAttribute('aria-label', 'Correct sentence ' + n);
          inp.spellcheck = false;
          q.appendChild(inp);
          sec.appendChild(q);
          it.n = n;
        });
      } else if (part.type === 'write') {
        var n = counter++;
        part.n = n;
        var q = el('div', 'q');
        q.appendChild(el('span', 'num', n + '.'));
        q.appendChild(document.createTextNode(part.prompt || 'Write your own sentences:'));
        sec.appendChild(q);
        part.items.forEach(function (it, j) {
          var box = el('div', 'q');
          box.appendChild(el('div', 'sub', LET[j] + ') ' + it.prompt));
          var ta = el('textarea', 'full');
          ta.name = 'q' + n + LET[j]; ta.rows = 2;
          ta.setAttribute('aria-label', 'Sentence ' + n + LET[j]);
          box.appendChild(ta);
          sec.appendChild(box);
        });
      }
      form.appendChild(sec);
    });

    var actions = el('div', 'actions');
    var copyBtn = el('button', 'primary', 'Copy link for teacher');
    copyBtn.type = 'button';
    var printBtn = el('button', 'ghost', 'Print');
    printBtn.type = 'button';
    actions.appendChild(copyBtn); actions.appendChild(printBtn);
    var hint = el('p', null, 'Last step: copy the link and send it in the Zoom chat.');
    hint.id = 'sendHint';
    actions.appendChild(hint);
    form.appendChild(actions);
    app.appendChild(form);

    app.appendChild(renderKey());

    copyBtn.addEventListener('click', function () {
      copyBtn.disabled = true;
      var linkP = packResult(collect()).then(resultLink);
      copyPromised(linkP).then(function (ok) {
        linkP.then(function (link) {
          form.classList.add('locked');
          form.querySelectorAll('input,textarea').forEach(function (i) { i.disabled = true; });
          actions.textContent = '';
          var done = el('div', ok ? null : 'warn', ok
            ? "\u2713 Link copied. Paste it into the Zoom chat and send. You're done!"
            : "Select the link below, copy it, and paste it into the Zoom chat. Then send. You're done!");
          done.id = 'sendDone';
          var f = el('input'); f.type = 'text'; f.readOnly = true; f.id = 'sendLink'; f.value = link;
          f.addEventListener('focus', function () { f.select(); });
          actions.appendChild(done); actions.appendChild(f);
          if (!ok) { f.focus(); f.select(); }
        });
      });
    });
    printBtn.addEventListener('click', function () { window.print(); });
  }

  function field(name) { var e = document.querySelector('[name="' + name + '"]'); return e ? e.value.trim() : ''; }
  function radio(name) { var e = document.querySelector('input[name="' + name + '"]:checked'); return e ? e.value : ''; }
  function blank(s) { return s ? '[' + s + ']' : '[ - ]'; }

  // What the student answered, part by part: choice -> chosen option number
  // (-1 for none), everything else -> the typed text.
  function collect() {
    var parts = [];
    T.parts.forEach(function (part) {
      if (part.type === 'choice') {
        parts.push(part.items.map(function (it) {
          var v = radio('q' + it.n);
          return it.options.indexOf(v);
        }));
      } else if (part.type === 'gap') {
        parts.push(part.items.map(function (it) { return field('q' + it.n); }));
      } else if (part.type === 'fix') {
        parts.push(part.items.map(function (it) { return field('q' + it.n); }));
      } else if (part.type === 'write') {
        parts.push(part.items.map(function (it, j) { return field('q' + part.n + LET[j]); }));
      } else { parts.push([]); }
    });
    return { t: 'g', p: parts };
  }

  // --- The link carries the answers; nothing is stored anywhere. ---
  async function packResult(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    var out = bytes, prefix = 'p';
    if (window.CompressionStream) {
      try {
        var cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        out = new Uint8Array(await new Response(cs).arrayBuffer());
        prefix = 'z';
      } catch (e) { out = bytes; prefix = 'p'; }
    }
    var bin = '';
    out.forEach(function (b) { bin += String.fromCharCode(b); });
    return prefix + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function unpackResult(code) {
    var prefix = code.charAt(0);
    var b64 = code.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    if (prefix === 'z') {
      var ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(ds).arrayBuffer());
    } else if (prefix !== 'p') { throw new Error('bad code'); }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function resultLink(code) {
    var q = new URLSearchParams(location.search);
    q.set('r', code);
    return location.origin + location.pathname + '?' + q.toString();
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return done;
  }
  // A clipboard item that takes a promise keeps Safari happy.
  function copyPromised(textPromise) {
    if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
      try {
        return navigator.clipboard.write([new ClipboardItem({ 'text/plain': textPromise.then(function (t) { return new Blob([t], { type: 'text/plain' }); }) })])
          .then(function () { return true; }, function () { return textPromise.then(legacyCopy, function () { return false; }); });
      } catch (e) {}
    }
    return textPromise.then(function (t) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return legacyCopy(t); });
      }
      return legacyCopy(t);
    }, function () { return false; });
  }

  // --- Teacher's view: read-only, tick or cross, never the right answers.
  function norm(v) {
    return String(v || '').toLowerCase().replace(/[‘’]/g, "'").replace(/n't\b/g, ' not')
      .replace(/\s+/g, ' ').replace(/[.!?\s]+$/, '').trim();
  }
  async function renderResults(code) {
    var data;
    try { data = await unpackResult(code); } catch (e) { data = null; }
    if (!data || data.t !== 'g' || !Array.isArray(data.p)) { fail('Ask the student to send the link again.'); return; }
    document.title = (T.topic || 'Grammar') + ': results';
    app.textContent = '';
    app.appendChild(el('div', 'brand', 'Anna | WeTalk'));
    app.appendChild(el('h1', null, (T.topic || 'Grammar') + ': student\'s answers'));
    var scoreEl = el('p', 'scoreline');
    app.appendChild(scoreEl);
    var right = 0, total = 0, hasWrite = false, counter = 1;

    function row(sec, n, text, ok) {
      var r = el('div', 'res ' + (ok === null ? '' : ok ? 'ok' : 'bad'));
      var t = el('div', 't');
      t.appendChild(el('span', 'num', n + '.'));
      if (text) t.appendChild(document.createTextNode(text)); else t.appendChild(el('span', 'none', '—'));
      r.appendChild(t);
      if (ok !== null) r.appendChild(el('span', 'm', ok ? '✓' : '✗'));
      sec.appendChild(r);
    }

    T.parts.forEach(function (part, pi) {
      var sec = el('section', 'part');
      var h = el('h2', null, 'Part ' + (pi + 1) + '. ' + part.title + ' ');
      sec.appendChild(h);
      var given = data.p[pi] || [];
      if (part.type === 'choice') {
        part.items.forEach(function (it, j) {
          var n = counter++, k = given[j];
          var chosen = (typeof k === 'number' && k >= 0) ? it.options[k] : '';
          var ok = chosen !== '' && k === it.answer;
          total++; if (ok) right++;
          row(sec, n, it.q.replace('___', chosen ? '[' + chosen + ']' : '[ — ]'), ok);
        });
      } else if (part.type === 'gap') {
        part.items.forEach(function (it, j) {
          var n = counter++, v = String(given[j] || '');
          var ok = v !== '' && norm(v) === norm(it.answer);
          total++; if (ok) right++;
          row(sec, n, [it.pre, v ? '[' + v + ']' : '[ — ]', it.post].filter(Boolean).join(' '), ok);
        });
      } else if (part.type === 'fix') {
        part.items.forEach(function (it, j) {
          var n = counter++, v = String(given[j] || '');
          var ok = v !== '' && norm(v) === norm(it.corrected);
          total++; if (ok) right++;
          row(sec, n, v, ok);
        });
      } else if (part.type === 'write') {
        hasWrite = true;
        var n = counter++;
        part.items.forEach(function (it, j) {
          var box = el('div', 'q');
          box.appendChild(el('div', 'sub', n + LET[j] + ') ' + it.prompt));
          var v = String(given[j] || '');
          var r = el('div', 'res');
          var t = el('div', 't');
          if (v) t.textContent = v; else t.appendChild(el('span', 'none', '—'));
          r.appendChild(t); box.appendChild(r); sec.appendChild(box);
        });
      }
      app.appendChild(sec);
    });
    scoreEl.textContent = right + ' / ' + total + ' correct' + (hasWrite ? ' (the writing part is not scored here)' : '');
    app.appendChild(el('p', 'hint', 'Read-only view. Nothing is saved anywhere.'));
  }

  // Teacher's key: hidden on screen, always the last page when printing.
  function renderKey() {
    var key = el('section', 'key');
    key.appendChild(el('h1', null, (T.topic || 'Grammar') + ' test: Teacher\'s key'));
    var total = 0;
    T.parts.forEach(function (p) { total += Number(p.max) || 0; });
    key.appendChild(el('p', null, 'Print page 1 only for the student. Maximum score: ' + total + '.'));

    T.parts.forEach(function (part, pi) {
      var head = 'Part ' + (pi + 1);
      key.appendChild(el('h2', null, head));
      var ul = el('ul');
      function li(label, text) {
        var l = el('li');
        l.appendChild(el('b', null, label));
        l.appendChild(document.createTextNode(text ? (/[.!?]$/.test(label) ? ' ' : ': ') + text : ''));
        ul.appendChild(l);
      }
      if (part.type === 'choice') {
        part.items.forEach(function (it) {
          li(it.n + '. ' + LET[it.answer] + ') ' + it.options[it.answer], it.why);
        });
      } else if (part.type === 'gap') {
        part.items.forEach(function (it) { li(it.n + '. ' + it.answer, it.why); });
      } else if (part.type === 'fix') {
        part.items.forEach(function (it) { li(it.n + '. ' + it.corrected, it.why); });
      } else if (part.type === 'write') {
        part.items.forEach(function (it, j) {
          var l = el('li');
          l.appendChild(el('b', null, part.n + LET[j] + '. '));
          l.appendChild(document.createTextNode((it.criteria || 'Accept any correct sentence that fits the prompt.') + ' Example: '));
          l.appendChild(el('i', null, it.example || ''));
          ul.appendChild(l);
        });
      }
      key.appendChild(ul);
    });

    var hi = Math.round(total * 0.875), mid = Math.round(total * 0.7);
    key.appendChild(el('h2', null, 'Scoring'));
    key.appendChild(el('p', null, hi + '-' + total + ': confident. ' + mid + '-' + (hi - 1) + ': needs a little polishing. Below ' + mid + ': revisit the grammar in this test.'));
    return key;
  }
})();
</script>
</body>
</html>
