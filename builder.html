<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link builder — Speaking Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2a24; --paper:#eeeae1; --paper-card:#f5f2ea;
    --line: rgba(31,42,36,0.14); --muted:#6b675f;
    --feedback:#4c7a6e; --feedback-bg:#dfe8e2; --radius:18px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:32px 16px 80px; -webkit-font-smoothing:antialiased;
  }
  .app{ width:100%; max-width:560px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:22px; margin:0 0 28px; }
  .card{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:28px 24px; margin-bottom:16px;
  }
  label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;
  }
  input[type=text]{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:15px;
    color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:20px;
  }
  textarea{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:15px; line-height:1.6;
    color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; min-height:160px; resize:vertical; margin-bottom:8px;
  }
  .hint{ font-size:12.5px; color:var(--muted); margin-bottom:20px; line-height:1.5; }
  button{
    font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; font-weight:500;
    color:#fdf9f4; background:var(--feedback); border:none; border-radius:10px;
    padding:11px 20px; cursor:pointer;
  }
  .result{
    background:var(--feedback-bg); border-radius:var(--radius);
    padding:22px 24px; margin-top:16px; display:none;
  }
  .result.show{ display:block; }
  .result-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--feedback); margin-bottom:10px;
  }
  .result-link{
    font-family:'IBM Plex Mono', monospace; font-size:13px; word-break:break-all;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:12px;
  }
  .copy-btn{ background:var(--feedback); }
  .copied{ font-size:12.5px; color:var(--feedback); margin-left:10px; display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">Speaking practice</div>
  <h1>Link builder</h1>

  <div class="card">
    <label for="topic">Topic (shown at the top of the page)</label>
    <input type="text" id="topic" placeholder="Purpose of Life. Soul." />

    <label for="questions">Questions — one per line, paste straight from Notion</label>
    <textarea id="questions" placeholder="What small things make life meaningful for you?
If nobody judged you, what would you spend more time doing?
Have your parents influenced your life choices?"></textarea>
    <div class="hint">Blank lines are ignored, so you can paste a whole block and not worry about tidying it up first.</div>

    <button id="generateBtn">Generate link</button>
  </div>

  <div class="result" id="result">
    <div class="result-label">Your link</div>
    <div class="result-link" id="resultLink"></div>
    <button class="copy-btn" id="copyBtn">Copy link</button>
    <span class="copied" id="copiedMsg">Copied!</span>
  </div>
</div>

<script>
const topicInput = document.getElementById('topic');
const questionsInput = document.getElementById('questions');
const generateBtn = document.getElementById('generateBtn');
const result = document.getElementById('result');
const resultLink = document.getElementById('resultLink');
const copyBtn = document.getElementById('copyBtn');
const copiedMsg = document.getElementById('copiedMsg');

generateBtn.addEventListener('click', () => {
  const topic = topicInput.value.trim();
  const questions = questionsInput.value
    .split('\n')
    .map(q => q.trim())
    .filter(Boolean);

  if(!questions.length){ return; }

  const base = window.location.origin + window.location.pathname.replace('builder.html', 'index.html');
  const params = new URLSearchParams();
  if(topic) params.set('topic', topic);
  params.set('q', questions.join('|'));

  resultLink.textContent = base + '?' + params.toString();
  result.classList.add('show');
  copiedMsg.style.display = 'none';
});

copyBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(resultLink.textContent);
    copiedMsg.style.display = 'inline';
  }catch(e){
    // fallback: select the text so the person can copy manually
    const range = document.createRange();
    range.selectNode(resultLink);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
});
</script>
</body>
</html>
