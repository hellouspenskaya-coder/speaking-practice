<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repair broken images — one-time tool</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #1e293b; }
  h1 { font-size: 20px; }
  .set-row { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .set-row.running { border-color: #0f9d80; background: #f0fdfa; }
  .set-row.done { border-color: #16a34a; background: #f0fdf4; }
  .set-row.error { border-color: #dc2626; background: #fef2f2; }
  .set-name { font-weight: 600; }
  .set-detail { font-size: 13px; color: #64748b; margin-top: 4px; }
  #startBtn { padding: 10px 18px; font-size: 14px; border-radius: 8px; border: none; background: #0f9d80; color: #fff; cursor: pointer; }
  #startBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #summary { margin-top: 20px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Repair broken images (one-time tool)</h1>
  <p>This finds every word set, re-downloads each picture, and embeds it permanently — so it never breaks again even if the original picture link stops working. Safe to run more than once.</p>
  <button id="startBtn">Start repair</button>
  <div id="sets" style="margin-top:16px;"></div>
  <p id="summary"></p>

<script>
async function callApi(body) {
  const res = await fetch('/api/vocab', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Working…';
  const setsDiv = document.getElementById('sets');
  setsDiv.innerHTML = '';

  let slugs;
  try {
    const listResult = await callApi({ action: 'listSets' });
    slugs = listResult.slugs;
  } catch (err) {
    setsDiv.innerHTML = `<p style="color:#dc2626;">Could not list sets: ${err.message}</p>`;
    btn.disabled = false;
    btn.textContent = 'Start repair';
    return;
  }

  let totalFixed = 0, totalFailed = 0, setsWithErrors = 0;

  for (const slug of slugs) {
    const row = document.createElement('div');
    row.className = 'set-row running';
    row.innerHTML = `<div class="set-name">${slug}</div><div class="set-detail">Checking…</div>`;
    setsDiv.appendChild(row);

    try {
      const result = await callApi({ action: 'repairImages', slug });
      if (result.skipped) {
        row.className = 'set-row done';
        row.querySelector('.set-detail').textContent = 'No external images to fix.';
      } else {
        const fixed = result.results.filter(r => r.status === 'fixed').length;
        const failed = result.results.filter(r => r.status !== 'fixed').length;
        totalFixed += fixed;
        totalFailed += failed;
        row.className = failed > 0 ? 'set-row error' : 'set-row done';
        row.querySelector('.set-detail').textContent =
          `${fixed} image(s) fixed` + (failed ? `, ${failed} could not be recovered (removed instead)` : '');
      }
    } catch (err) {
      setsWithErrors++;
      row.className = 'set-row error';
      row.querySelector('.set-detail').textContent = 'Error: ' + err.message;
    }
  }

  document.getElementById('summary').textContent =
    `Done. ${totalFixed} images fixed, ${totalFailed} could not be recovered` +
    (setsWithErrors ? `, ${setsWithErrors} set(s) had errors.` : '.');
  btn.disabled = false;
  btn.textContent = 'Run again';
});
</script>
</body>
</html>
