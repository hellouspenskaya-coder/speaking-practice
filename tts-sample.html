<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groq voice samples (temporary)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; color: #1e293b; }
  h1 { font-size: 18px; }
  h2 { font-size: 15px; margin-top: 24px; color: #475569; }
  .voice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  button { padding: 12px; font-size: 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  button.loaded { border-color: #16a34a; }
  .status { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Temporary: audition Groq voices</h1>
  <p style="font-size:13px;color:#64748b;">Tap a button to generate and play that voice for the phrase. First tap takes a couple of seconds (real API call); each button caches its own audio after that.</p>

  <h2>"get, got, got"</h2>
  <div class="voice-grid" id="phrase1"></div>

  <h2>"make, made, made"</h2>
  <div class="voice-grid" id="phrase2"></div>

<script>
const VOICES = ['autumn', 'diana', 'hannah', 'austin', 'daniel', 'troy'];
const PHRASES = {
  phrase1: 'get, got, got',
  phrase2: 'make, made, made'
};

async function playSample(btn, statusEl, text, voice) {
  if (btn.dataset.audioUrl) {
    new Audio(btn.dataset.audioUrl).play().catch(err => showError(btn, statusEl, voice, 'Playback blocked: ' + err.message));
    return;
  }
  btn.disabled = true;
  btn.textContent = voice + ' — loading…';
  statusEl.textContent = '';
  try {
    const res = await fetch('/api/vocab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'ttsSample', text, voice })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    btn.dataset.audioUrl = data.audio;
    btn.classList.add('loaded');
    btn.textContent = voice + ' ▶ (loaded)';
    btn.style.borderColor = '';
    await new Audio(data.audio).play().catch(err => showError(btn, statusEl, voice, 'Playback blocked: ' + err.message));
  } catch (err) {
    showError(btn, statusEl, voice, err.message);
  } finally {
    btn.disabled = false;
  }
}

function showError(btn, statusEl, voice, message) {
  btn.textContent = voice + ' — error';
  btn.style.borderColor = '#dc2626';
  statusEl.textContent = message;
  statusEl.style.color = '#dc2626';
}

Object.entries(PHRASES).forEach(([gridId, text]) => {
  const grid = document.getElementById(gridId);
  VOICES.forEach(voice => {
    const wrap = document.createElement('div');
    const btn = document.createElement('button');
    btn.textContent = voice;
    btn.style.width = '100%';
    const status = document.createElement('p');
    status.className = 'status';
    status.style.wordBreak = 'break-word';
    btn.addEventListener('click', () => playSample(btn, status, text, voice));
    wrap.appendChild(btn);
    wrap.appendChild(status);
    grid.appendChild(wrap);
  });
});
</script>
</body>
</html>
